source_id: activate-fellowship
name: Activate Fellowship
type: fellowship
description: >
  The Activate Fellowship supports scientists and engineers commercialising
  breakthrough hardware, climate, and energy technologies. Fellows receive
  two years of salary ($100,000/year), lab access, and business mentorship to
  transition from research to company formation. Applicants must have a PhD or
  equivalent research experience and a technology ready for commercial translation.
  US-based fellows only; team size at application must be 1–3 people.
