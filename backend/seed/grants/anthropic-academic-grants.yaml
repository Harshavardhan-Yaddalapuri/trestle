name: Anthropic Academic Research Grants
type: grant
description: >
  Anthropic's Academic Research Grant program funds university researchers
  working on AI safety, alignment, and interpretability. Grants of $50,000–$200,000
  support work that advances the science of making AI systems safe, honest, and
  beneficial. Priority areas include mechanistic interpretability, scalable oversight,
  robustness, and formal verification of neural networks. Applicants must hold an
  academic affiliation at an accredited institution. Open to researchers globally.
