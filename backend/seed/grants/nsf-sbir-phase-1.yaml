source_id: nsf-sbir-phase-1
name: NSF SBIR Phase I
type: grant
description: >
  The National Science Foundation Small Business Innovation Research (SBIR) Phase I
  program provides non-dilutive funding of up to $275,000 to support exploratory
  R&D for technology-based small businesses. Phase I establishes technical merit,
  feasibility, and commercial potential of proposed R&D. Open to US-based small
  businesses across all technology sectors including deep tech, biotech, and advanced
  manufacturing.
